<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#B5524A" />
    <meta name="format-detection" content="telephone=no" />
    <!-- H-09 · SEO básico:
         · description describre la APP (no datos del negocio: este HTML
           es el mismo en todos los despliegues y no lleva VITE_xxx ni
           emojis/«%» — Vite decodeURI() revienta con «%» inválidos).
         · robots = noindex,nofollow: la app es una herramienta de
           GESTIÓN INTERNA (citas/clientes/finanzas detrás de la URL del
           despliegue), no un sitio público, así que sus vistas no deben
           indexarse. noindex exige que el rastreo NO esté bloqueado
           (por eso public/robots.txt hace Allow) para que el buscador
           pueda LEER esta meta.
         · Esto NO protege información: la protección real depende de los
           controles de acceso existentes (token del backend / SB_SYNC). -->
    <meta name="description" content="Aplicación web para gestionar citas, clientes, servicios, ingresos y gastos de un negocio de belleza y bienestar: agenda, finanzas y reportes en un solo lugar." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!--
      Nota: NO uses placeholders VITE_xxx en atributos del HTML.
      Vite ejecuta decodeURI() sobre los href durante el build de
      producción y rompe con "URI malformed" si hay un porcentaje
      no válido. El título y el favicon se definen dinámicamente
      desde App.jsx usando import.meta.env (con valores por defecto).
    -->
    <!-- Título de RESPALDO: lo que se ve antes de que arranque React.
         El real lo escribe App.jsx en runtime con VITE_BIZ_NAME (no se
         puede poner aquí: Vite haría decodeURI() sobre el HTML y ya
         reventó con "URI malformed"). Un despliegue nuevo cambia de
         nombre con VITE_BIZ_NAME, sin tocar este archivo. -->
    <title>Gestión</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌸%3C/text%3E%3C/svg%3E" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
